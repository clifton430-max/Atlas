# Minimal Supabase CLI configuration for Atlas.
# Used by `supabase link`, `supabase db push` and `supabase functions deploy`.
project_id = "atlas"

[functions.discover-events]
# The function serves PUBLIC Discover data (events), works for signed-out
# visitors, and never uses the caller's identity. JWT verification is off so
# it also works with Supabase's newer non-JWT publishable keys. Provider calls
# are rate-limited by the event_fetch_log cache.
verify_jwt = false

[functions.place-details]
# Public, read-only OpenStreetMap/Wikimedia details (no user data); protected
# by per-client rate limits, upstream budgets and a server-side cache.
verify_jwt = false

[functions.route]
# Public routing proxy (no user data stored); per-client and global rate limits.
verify_jwt = false

[functions.chess-move]
# Verifies the caller's session itself (works with publishable keys); the
# move authority for online chess. Never trusts client FEN/results.
verify_jwt = false
